name: Collect GBFS snapshots

on:
  schedule:
    - cron: "*/10 * * * *"     
  workflow_dispatch:           

permissions:
  contents: write              

concurrency:
  group: gbfs
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python gbfs_snapshot.py
      - name: Save the data to the repository
        run: |
          git config user.name "gbfs-bot"
          git config user.email "gbfs-bot@users.noreply.github.com"
          git add data
          git commit -m "GBFS snapshot $(date -u +'%Y-%m-%d %H:%M')" || echo "Nothing new"
          git pull --rebase
          git push
